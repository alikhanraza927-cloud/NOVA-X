<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>NOVA X</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .status {
      color: #00ff88;
      font-size: 12px;
      margin-top: 6px;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.4;
    }

    .nova {
      background: #151515;
      align-self: flex-start;
    }

    .user {
      background: #242424;
      align-self: flex-end;
    }

    .input-area {
      padding: 15px;
      border-top: 1px solid #222;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      background: #111;
      color: white;
      border: 1px solid #333;
      border-radius: 25px;
      padding: 14px 17px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      background: white;
      color: black;
      font-size: 18px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">NOVA X</div>
    <div class="status">● SYSTEM ONLINE</div>
  </header>

  <main id="chat">
    <div class="message nova">
      Hello. I'm NOVA X. 🤖<br>
      Your personal AI assistant.
    </div>
  </main>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Talk to NOVA X..."
      autocomplete="off"
    >

    <button onclick="sendMessage()">➤</button>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const chat = document.getElementById("chat");

      const text = input.value.trim();

      if (!text) return;

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = text;

      chat.appendChild(userMessage);

      input.value = "";

      setTimeout(() => {
        const novaMessage = document.createElement("div");
        novaMessage.className = "message nova";

        novaMessage.textContent =
          "I'm ready. My AI brain will be connected next. ⚡";

        chat.appendChild(novaMessage);

        chat.scrollTop = chat.scrollHeight;
      }, 500);

      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById("messageInput")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      });
  </script>

</body>
</html>
